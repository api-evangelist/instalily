aid: instalily
name: Instalily
description: 'InstaLILY builds Lily, an AI "Forward Deployed Engineer" for the physical
  and regulated economy. Lily learns how an enterprise operates, builds custom software
  agents for high-friction operational work such as quoting, routing, field service,
  and approvals, and runs them inside the systems companies already use including SAP,
  NetSuite, Epicor, Salesforce, HubSpot, and Snowflake. InstaLILY serves industrial
  distribution and MRO, manufacturing and OEM, field service, healthcare and pharma,
  and private equity. The company is headquartered at 455 Broadway, New York, and is
  backed by Insight Partners. No public developer API is currently published.'
